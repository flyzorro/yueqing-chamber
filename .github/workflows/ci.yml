name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint src --ext .ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  runtime-contract:
    runs-on: ubuntu-latest
    needs: [server, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Check runtime contract
        run: bash scripts/check-runtime-contract.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [server, mobile, runtime-contract]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yueqing_chamber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d yueqing_chamber_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yueqing_chamber_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Push Prisma schema to test database
        working-directory: server
        run: npx prisma db push

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start server
        working-directory: server
        run: npm run dev &
        
      - name: Wait for server
        run: sleep 5

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30