name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint src --ext .ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yueqing_chamber_test?schema=public
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  runtime-contract:
    runs-on: ubuntu-latest
    needs: [server, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Check runtime contract
        run: bash scripts/check-runtime-contract.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [server, mobile, runtime-contract]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yueqing_chamber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d yueqing_chamber_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yueqing_chamber_test?schema=public
      JWT_SECRET: test-jwt-secret-for-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Push Prisma schema to test database
        working-directory: server
        run: npx prisma db push

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start server (build first)
        working-directory: server
        run: |
          npx prisma generate
          npx tsc
          node dist/index.js &
          sleep 5

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-production:
    runs-on: ubuntu-latest
    needs: [server, mobile, runtime-contract, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Production
        run: railway up --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ secrets.RAILWAY_ENVIRONMENT_ID }} --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}