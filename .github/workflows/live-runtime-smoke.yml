name: Live Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Live runtime base URL
        required: false
        default: https://yueqing-chamber-production.up.railway.app
  schedule:
    - cron: '0 1 * * *'

jobs:
  live-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Resolve base URL
        run: |
          BASE_URL="${{ github.event.inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://yueqing-chamber-production.up.railway.app"
          fi
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Run live runtime contract smoke
        run: npm run check:live-runtime-contract -- "$BASE_URL"

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo '## Live Runtime Smoke'
            echo
            echo "- Base URL: \
`$BASE_URL`"
            echo "- Script: `npm run check:live-runtime-contract -- <base_url>`"
            echo "- Trigger: `${{ github.event_name }}`"
          } >> "$GITHUB_STEP_SUMMARY"
